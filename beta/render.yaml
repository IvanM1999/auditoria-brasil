services:
  - type: web
    name: auditoria-brasil
    runtime: node
    plan: starter
    rootDir: beta
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/app.sqlite
      - key: ADMIN_EMAIL
        value: admin@auditoria-brasil.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: VITE_BASE44_APP_ID
        sync: false
      - key: VITE_BASE44_APP_BASE_URL
        sync: false
      - key: AI_MODEL_PRIMARY
        value: llama3.2:3b
      - key: AI_MODEL_SECONDARY
        value: qwen2.5:3b
      - key: AI_REQUEST_TIMEOUT_MS
        value: "12000"
      - key: AI_MAX_INPUT_CHARS
        value: "4000"
      - key: AI_MAX_OUTPUT_CHARS
        value: "4000"
      - key: AI_PROVIDER_PRIMARY_URL
        sync: false
      - key: AI_PROVIDER_SECONDARY_URL
        sync: false
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1
